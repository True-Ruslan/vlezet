packages:
  - apps/*
  - packages/*

allowBuilds:
  sharp: true
  unrs-resolver: true

overrides:
  # next@16.2.12 still bundles these older transitive versions internally;
  # force the Dependabot-patched releases until Next.js updates its own pins.
  sharp: ">=0.35.0"
  postcss: ">=8.5.23"
  nanoid: ">=3.3.18"
  # transitive dev-tooling (eslint chain) pulled in stale advisory-flagged
  # versions; dev-only (never shipped), forced here for hygiene. Two
  # independent major lineages of brace-expansion are present in the tree
  # (1.x and 5.x, an incompatible API rewrite) so each is pinned within its
  # own major line rather than forcing every consumer onto 5.x.
  "brace-expansion@1": ">=1.1.18 <2"
  "brace-expansion@5": ">=5.0.9 <6"
  js-yaml: ">=4.3.1"

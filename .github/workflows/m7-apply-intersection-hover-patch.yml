name: Apply M7.4 intersection hover patch

on:
  push:
    branches:
      - feat/m7-4-canvas-selection-mode-feedback
    paths:
      - .github/workflows/m7-apply-intersection-hover-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m7-4-canvas-selection-mode-feedback
          fetch-depth: 0

      - name: Apply focused intersection patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/components/editor/editor-canvas.tsx")
          source = path.read_text()
          old = '    setHoveredCanvasEntity(hoverEnabled ? canvasEntityFromKonvaNode(event.target) : null);\n'
          new = '    const stage = event.target.getStage();\n    const hitNode = stage?.getIntersection(pointer) ?? event.target;\n    setHoveredCanvasEntity(hoverEnabled ? canvasEntityFromKonvaNode(hitNode) : null);\n'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected one hover lookup, found {count}")
          path.write_text(source.replace(old, new, 1))

      - name: Remove one-shot workflow
        run: rm .github/workflows/m7-apply-intersection-hover-patch.yml

      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/editor/editor-canvas.tsx .github/workflows/m7-apply-intersection-hover-patch.yml
          git commit -m "fix: resolve Canvas hover through Konva intersection"
          git push origin HEAD:feat/m7-4-canvas-selection-mode-feedback

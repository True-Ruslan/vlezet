name: Apply guarded browser seed fix

on:
  push:
    branches:
      - feat/m7-8c-1-hybrid-ai-proposal-recovery
    paths:
      - .github/workflows/fix-ai-proposal-browser-seed.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-8c-1-hybrid-ai-proposal-recovery
          fetch-depth: 0
      - name: Patch repeated project seeding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/m7-browser-audit/recognition-ai-proposals.spec.mjs")
          source = path.read_text()
          old = '''  await page.goto("/");\n  await expect(page.getByRole("heading", { name: "Планировки, к которым можно вернуться" })).toBeVisible();\n  const base64 = input.png.toString("base64");'''
          new = '''  await page.goto("/");\n  await expect(page.locator("body")).toBeVisible();\n  const base64 = input.png.toString("base64");'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one seed anchor, found {count}")
          path.write_text(source.replace(old, new))
          PY
          rm .github/workflows/fix-ai-proposal-browser-seed.yml
          git diff --check
      - name: Commit fix and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/m7-browser-audit/recognition-ai-proposals.spec.mjs \
            .github/workflows/fix-ai-proposal-browser-seed.yml
          git commit -m "test: allow repeated browser project seeding"
          git push origin HEAD:feat/m7-8c-1-hybrid-ai-proposal-recovery

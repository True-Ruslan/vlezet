name: Apply M7.4 hit-hover patch

on:
  push:
    branches:
      - feat/m7-4-canvas-selection-mode-feedback
    paths:
      - .github/workflows/m7-apply-hit-hover-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m7-4-canvas-selection-mode-feedback
          fetch-depth: 0

      - name: Apply focused Canvas patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/components/editor/editor-canvas.tsx")
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old[:120]!r}")
              source = source.replace(old, new, 1)

          replace_once(
              'import { deriveCanvasEntityVisual } from "./canvas-entity-visual";\n',
              'import { canvasEntityName, parseCanvasEntityName, type CanvasEntityIdentity } from "./canvas-entity-identity";\nimport { deriveCanvasEntityVisual } from "./canvas-entity-visual";\n',
          )
          replace_once(
              'type HoveredCanvasEntity = Readonly<{\n  kind: "room" | "wall" | "opening" | "object";\n  id: string;\n}> | null;\n',
              'type HoveredCanvasEntity = CanvasEntityIdentity | null;\n',
          )
          replace_once(
              'function visualStroke(role: ReturnType<typeof deriveCanvasEntityVisual>["strokeRole"], ordinary: string): string {\n  if (role === "accent") return "#1769ff";\n  if (role === "danger") return "#ef4444";\n  if (role === "hover") return "#5b8def";\n  return ordinary;\n}\n',
              'function visualStroke(role: ReturnType<typeof deriveCanvasEntityVisual>["strokeRole"], ordinary: string): string {\n  if (role === "accent") return "#1769ff";\n  if (role === "danger") return "#ef4444";\n  if (role === "hover") return "#5b8def";\n  return ordinary;\n}\n\nfunction canvasEntityFromKonvaNode(node: Konva.Node | null): HoveredCanvasEntity {\n  let current = node;\n  while (current) {\n    const identity = parseCanvasEntityName(current.name());\n    if (identity) return identity;\n    current = current.getParent();\n  }\n  return null;\n}\n',
          )
          replace_once(
              '    if (recognitionReviewActive) return;\n    if (placementPresetId) updatePlacementPreview(pointer);\n',
              '    setHoveredCanvasEntity(hoverEnabled ? canvasEntityFromKonvaNode(event.target) : null);\n    if (recognitionReviewActive) return;\n    if (placementPresetId) updatePlacementPreview(pointer);\n',
          )
          replace_once(
              '              key={room.id}\n              points={screenPolygon(room.polygon, viewport)}\n',
              '              key={room.id}\n              name={canvasEntityName("room", room.id)}\n              points={screenPolygon(room.polygon, viewport)}\n',
          )
          replace_once(
              '              key={`${wall.id}-visible-${index}`}\n              points={[a.x, a.y, b.x, b.y]}\n',
              '              key={`${wall.id}-visible-${index}`}\n              name={canvasEntityName("wall", wall.id)}\n              points={[a.x, a.y, b.x, b.y]}\n',
          )
          replace_once(
              'elements.push(<Line key={`${opening.id}-window-${sign}`} points=',
              'elements.push(<Line key={`${opening.id}-window-${sign}`} name={!preview ? canvasEntityName("opening", opening.id) : undefined} points=',
          )
          replace_once(
              'elements.push(<Line key={`${opening.id}-leaf`} points=',
              'elements.push(<Line key={`${opening.id}-leaf`} name={!preview ? canvasEntityName("opening", opening.id) : undefined} points=',
          )
          replace_once(
              '              onHoverChange={(hovered) => setHoveredCanvasEntity(hovered ? { kind: "object", id: object.id } : null)}\n',
              '',
          )

          path.write_text(source)

      - name: Remove one-shot workflow
        run: rm .github/workflows/m7-apply-hit-hover-patch.yml

      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/editor/editor-canvas.tsx .github/workflows/m7-apply-hit-hover-patch.yml
          git commit -m "fix: derive Canvas hover from Konva hit graph"
          git push origin HEAD:feat/m7-4-canvas-selection-mode-feedback

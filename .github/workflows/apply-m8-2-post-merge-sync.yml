name: Apply M8.2 Post-Merge Truth Sync

on:
  push:
    branches:
      - docs/m8-2-post-merge-integration
    paths:
      - .github/workflows/apply-m8-2-post-merge-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/m8-2-post-merge-integration
          fetch-depth: 0
      - name: Apply post-merge truth sync
        run: python tools/m7-browser-audit/temp-m8-2-post-merge-sync.py
      - name: Verify diff
        run: |
          git diff --check
          git diff -- docs/PROJECT_STATE.md docs/ROADMAP.md docs/product/UX_ROADMAP.md docs/CHANGELOG.md docs/milestones/m8-2-acceptance.md
      - name: Commit sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/product/UX_ROADMAP.md docs/CHANGELOG.md docs/milestones/m8-2-acceptance.md
          git commit -m "docs: record M8.2 protected integration"
          git push origin HEAD:docs/m8-2-post-merge-integration

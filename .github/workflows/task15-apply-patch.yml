name: Temporary Tasks 14-15 patch

on:
  push:
    branches:
      - feat/m7-8c-1-hybrid-ai-proposal-recovery
    paths:
      - .github/workflows/task15-apply-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply checked patch
        run: |
          set -euo pipefail
          git apply --check .github/task15-atomic.patch
          git apply .github/task15-atomic.patch
          rm .github/task15-atomic.patch
          rm .github/workflows/task15-apply-patch.yml
          rm packages/recognition/src/task15-source-dump.test.ts
          git diff --check
      - name: Commit exact result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate atomic AI proposal workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"

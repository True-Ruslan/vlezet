name: Apply M8.2 Door Hit Target Truth Sync

on:
  push:
    branches:
      - feat/m8-2-precision-structural-editing
    paths:
      - .github/workflows/apply-m8-2-door-hit-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-2-precision-structural-editing
          fetch-depth: 0

      - name: Apply exact documentation truth sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one marker, got {count}")
              return text.replace(old, new, 1)

          # PROJECT_STATE
          path = Path("docs/PROJECT_STATE.md")
          text = path.read_text()
          lines = text.splitlines()
          status_prefix = "**Status:** M0–M8.1 are implemented, product-accepted and merged."
          status_indexes = [i for i, line in enumerate(lines) if line.startswith(status_prefix)]
          if len(status_indexes) != 1:
              raise SystemExit(f"PROJECT_STATE status marker count: {len(status_indexes)}")
          lines[status_indexes[0]] = "**Status:** M0–M8.1 are implemented, product-accepted and merged. M8.2 Precision Drawing / Direct Manipulation Foundation is implemented in Draft PR #87 but is **not product-accepted**. The latest product-owner confirmation reports room+furniture marquee **PASS**, window movement **PASS**, and hosted-door movement/runtime **functional PASS**, with one remaining UX finding: the door was still hard to acquire because pointer-down had to land on the thin leaf. The door wall-opening/leaf/arc hit-target correction is now product-code GREEN in Chromium and representative WebKit; a fresh exact-head gate is required after this documentation truth-sync. Final product-owner door-UX confirmation remains **PENDING**.  "
          text = "\n".join(lines) + ("\n" if text.endswith("\n") else "")
          text = replace_once(
              text,
              "- doors/windows can be dragged directly along their **current** host wall; `wallId` is preserved, movement is constrained to the valid host span and overlap/invalid positions reject visibly with no partial commit;\n- both window visual lines now retain their thin appearance but expose a practical 12 px listening hit stroke for ordinary pointer drag;",
              "- doors/windows can be dragged directly along their **current** host wall; `wallId` is preserved, movement is constrained to the valid host span and overlap/invalid positions reject visibly with no partial commit;\n- door direct manipulation now treats the full host-wall opening span, the visible leaf and the swing arc as practical pointer targets with a minimum 12 px listening stroke; the complete swing sector deliberately remains non-listening so room/furniture clicks are not stolen;\n- both window visual lines now retain their thin appearance but expose a practical 12 px listening hit stroke for ordinary pointer drag;",
              "PROJECT_STATE door bullet",
          )
          door_section = '''### Final door hit-target product-owner usability correction — 2026-08-13

The next focused product-owner check reported:

- hosted door movement/runtime: **functional PASS**, but acquiring the door still required pixel-precise aim at the thin leaf;
- room + furniture no-modifier marquee/movement: **PASS**;
- representative window movement: **PASS**.

The remaining door issue was treated as a real UX finding. A permanent Playwright regression now starts drag from the **centre of the wall opening span**, not from the leaf. The clean RED proved the pointer fell into ordinary selection/marquee handling instead of opening movement:

```text
harness-only syntax failure:       9e037fce958d91f07a504756922de4b5c8389b3b / Browser #1523 — excluded from product RED
valid RED head:                    e41c695b193a9e20ec0173453cd23d093f1bfaab
CI #5074:                          PASS
Browser Acceptance #1524:         EXPECTED FAIL — 54 PASS / 1 FAIL (door opening-span drag only)
production patch:                  9f37c7c0db394e7f924c732e4d191d3bff724ecf
clean product-code head:           8f9317db650bd076df957028035f6a643d0ec470
CI #5082 / run 31679924606:        PASS
Browser Acceptance #1532:         PASS — Chromium + WebKit
browser run:                       31679924617
browser artifact:                  9173229566
artifact digest:                   sha256:14ff9ba47d708c881adfdccf89f11218efac4af9f54862f332ebd0f487b65ea3
```

The interaction target is intentionally limited to the wall opening, leaf and arc. The full quarter-circle swing sector is not clickable because it could intercept surrounding room/furniture interaction. Visual geometry, `wallId`, host-wall projection, validation and semantic history are unchanged.

Focused provenance: `docs/changelog/2026-08-13-m8-2-door-hit-target-correction.md`.

**Remaining acceptance gate:** fresh exact-head CI + Browser Acceptance after this truth-sync, then only a short product-owner confirmation that the door can be comfortably acquired from its wall-opening area without unexpected surrounding-click capture. The already reported marquee/window PASS does not need to be repeated.

'''
          text = replace_once(text, "### Reference/recognition\n", door_section + "### Reference/recognition\n", "PROJECT_STATE door section")
          text = replace_once(
              text,
              "      latest runtime/marquee/window correction AUTOMATED GREEN on product-code head;\n      final docs-head gate required;\n      product-owner acceptance PENDING;",
              "      latest door hit-target correction PRODUCT-CODE AUTOMATED GREEN;\n      room marquee + window + functional door movement product-owner PASS;\n      final docs-head gate + focused door-UX confirmation required;\n      product-owner acceptance PENDING;",
              "PROJECT_STATE programme",
          )
          path.write_text(text)

          # ROADMAP
          path = Path("docs/ROADMAP.md")
          text = path.read_text()
          text = replace_once(
              text,
              "            latest runtime/marquee/window regressions FIXED + product-code AUTOMATED GREEN;\n            final documentation-head CI/Browser gate required;\n            product-owner acceptance PENDING;",
              "            latest door hit-target usability correction PRODUCT-CODE AUTOMATED GREEN;\n            room marquee + window + functional door movement product-owner PASS;\n            final documentation-head CI/Browser + focused door-UX confirmation required;\n            product-owner acceptance PENDING;",
              "ROADMAP summary",
          )
          old_para = "M8.2 remains the active Draft delivery slice in PR #87 and is **not product-accepted**. Multiple product-owner rounds have deliberately reopened the acceptance gate when real interaction gaps were found. The latest round exposed a Turbopack/Fast Refresh live-store action mismatch during hosted-door interaction, the lack of semantic whole-room no-modifier marquee selection and an impractically narrow window drag hit target. Those exact paths now have genuine RED evidence, causal fixes and product-code GREEN in Chromium and representative WebKit. A fresh exact-head gate is still required after documentation truth-sync; automation alone does not accept M8.2."
          new_para = "M8.2 remains the active Draft delivery slice in PR #87 and is **not product-accepted**. Multiple product-owner rounds have deliberately reopened the acceptance gate when real interaction gaps were found. The runtime/marquee/window round is now manually confirmed for the marquee and window paths and functionally confirmed for hosted-door movement. That confirmation exposed one final usability gap: the door itself was still too hard to acquire because only the thin leaf was a practical target. The wall-opening/leaf/arc hit-target correction now has genuine RED evidence and product-code GREEN in Chromium and representative WebKit. A fresh exact-head gate plus one focused door-UX confirmation remain; automation alone does not accept M8.2."
          text = replace_once(text, old_para, new_para, "ROADMAP status paragraph")
          text = replace_once(
              text,
              "- direct door/window drag projects onto the existing host wall, preserves `wallId`, stays inside the valid host span and rejects overlap/invalid candidates visibly with no partial commit;\n- hosted-opening actions missing from a preserved Turbopack/Fast Refresh live Zustand singleton",
              "- direct door/window drag projects onto the existing host wall, preserves `wallId`, stays inside the valid host span and rejects overlap/invalid candidates visibly with no partial commit;\n- door acquisition uses the full host-wall opening span, leaf and swing arc as practical listening geometry with a minimum 12 px hit stroke, while the full swing sector remains non-listening to avoid stealing room/furniture clicks;\n- hosted-opening actions missing from a preserved Turbopack/Fast Refresh live Zustand singleton",
              "ROADMAP door bullet",
          )
          old_gate = "Focused record: `docs/changelog/2026-08-13-m8-2-runtime-marquee-window-regressions.md`.\n\n**Remaining M8.2 gate:** fresh exact-head verification after documentation sync, then explicit product-owner PASS. M8.3 remains blocked until M8.2 is accepted and protected-merged."
          new_gate = '''Focused record: `docs/changelog/2026-08-13-m8-2-runtime-marquee-window-regressions.md`.

Final door-target usability correction:

```text
valid door UX RED head:            e41c695b193a9e20ec0173453cd23d093f1bfaab
CI #5074:                          PASS
Browser Acceptance #1524:         EXPECTED FAIL — 54 PASS / 1 FAIL (door opening span only)
production patch:                  9f37c7c0db394e7f924c732e4d191d3bff724ecf
clean product-code head:           8f9317db650bd076df957028035f6a643d0ec470
CI #5082 / run 31679924606:        PASS
Browser Acceptance #1532:         PASS — Chromium + WebKit
browser artifact:                  9173229566
artifact digest:                   sha256:14ff9ba47d708c881adfdccf89f11218efac4af9f54862f332ebd0f487b65ea3
```

Focused record: `docs/changelog/2026-08-13-m8-2-door-hit-target-correction.md`.

**Remaining M8.2 gate:** fresh exact-head verification after documentation sync, then only focused product-owner confirmation that door acquisition from the wall opening feels practical and does not steal surrounding interaction. The room-marquee and window scenarios are already product-owner PASS. M8.3 remains blocked until M8.2 is accepted and protected-merged.'''
          text = replace_once(text, old_gate, new_gate, "ROADMAP final gate")
          path.write_text(text)

          # UX_ROADMAP
          path = Path("docs/product/UX_ROADMAP.md")
          text = path.read_text()
          third_evidence = "A third product-evidence correction occurred on 2026-08-13. A real Turbopack development session exposed `beginStructuralOpeningGesture is not a function`, ordinary no-modifier marquee could not select one room + its furniture as a semantic movable group, and visible windows remained difficult to drag because their listening stroke was too narrow. These failures were reproduced with genuine unit and Playwright REDs. They are now fixed and automated GREEN on the product-code head in Chromium and representative WebKit. This evidence further strengthens the rule that **fresh-process browser GREEN is not sufficient when a real preserved dev-runtime state or ordinary pointer tolerance is part of the user journey**."
          fourth_evidence = third_evidence + "\n\nA fourth focused usability correction followed immediately after the product owner confirmed marquee **PASS**, window movement **PASS** and functional door movement/runtime **PASS**: the door was still unpleasant to acquire because the pointer had to land on the thin leaf. Vlezet now treats the wall opening, leaf and swing arc as the practical door target while deliberately leaving the full swing sector non-listening. This preserves ordinary room/furniture selection around the door."
          text = replace_once(text, third_evidence, fourth_evidence, "UX evidence")
          text = replace_once(
              text,
              "  - latest runtime/marquee/window regressions FIXED\n  - product-code Chromium + WebKit GREEN\n  - final docs-head CI/Browser gate required\n  - product-owner acceptance PENDING",
              "  - runtime/marquee/window correction confirmed; marquee + window PASS, functional door movement PASS\n  - final door hit-target usability correction PRODUCT-CODE Chromium + WebKit GREEN\n  - final docs-head CI/Browser + focused door-UX confirmation required\n  - product-owner acceptance PENDING",
              "UX sequence",
          )
          text = replace_once(
              text,
              "- direct door/window movement constrained to the current host wall with stable `wallId`, valid-span clamping/validation and no silent re-host;\n- overlap/invalid opening drag shows fail-closed feedback and commits nothing;",
              "- direct door/window movement constrained to the current host wall with stable `wallId`, valid-span clamping/validation and no silent re-host;\n- practical door acquisition from the complete host-wall opening span, visible leaf or swing arc, each with a minimum 12 px listening target where needed; the full swing sector remains non-listening;\n- overlap/invalid opening drag shows fail-closed feedback and commits nothing;",
              "UX door bullet",
          )
          door_ux_section = '''### Final door hit-target usability correction

The product owner confirmed the latest three scenarios as follows:

- door movement/runtime: **functional PASS**, with a remaining acquisition UX complaint;
- room + furniture marquee/movement: **PASS**;
- window movement: **PASS**.

The permanent Playwright door scenario was therefore strengthened to begin drag from the **centre of the wall opening span**. The first test-only commit had a syntax typo and is excluded from product evidence. The clean RED then produced 54 PASS / 1 FAIL in Chromium, with only the new door opening-span interaction failing. After the Canvas hit-area correction, the same complete Chromium/WebKit suite passed.

```text
valid RED:                      e41c695b193a9e20ec0173453cd23d093f1bfaab
CI #5074:                      PASS
Browser #1524:                EXPECTED FAIL — 54 PASS / 1 FAIL
production patch:               9f37c7c0db394e7f924c732e4d191d3bff724ecf
clean product-code head:        8f9317db650bd076df957028035f6a643d0ec470
CI #5082:                      PASS
Browser #1532:                PASS — Chromium + WebKit
artifact:                       9173229566
artifact digest:                sha256:14ff9ba47d708c881adfdccf89f11218efac4af9f54862f332ebd0f487b65ea3
```

Interaction decision: wall opening + leaf + arc are clickable; the filled quarter-circle sector is not. This is intentionally narrower than “everything inside the door swing” so furniture and room interaction remain reachable.

Focused provenance: `docs/changelog/2026-08-13-m8-2-door-hit-target-correction.md`.

'''
          text = replace_once(text, "### Current correction contract\n", door_ux_section + "### Current correction contract\n", "UX door section")
          text = replace_once(
              text,
              "8. **Practical hit targets.** Thin visual geometry may use a larger invisible interaction target so the ordinary pointer journey is usable without pixel-perfect aim.",
              "8. **Practical hit targets.** Thin visual geometry may use a larger invisible interaction target so the ordinary pointer journey is usable without pixel-perfect aim. For doors, the host-wall opening span, leaf and swing arc are targets; the filled swing sector is not. Windows retain thin visuals with a 12 px interaction stroke.",
              "UX contract practical target",
          )
          path.write_text(text)

          # Main CHANGELOG — prepend concise milestone entry.
          path = Path("docs/CHANGELOG.md")
          text = path.read_text()
          marker = "This is a milestone changelog rather than a package-release log. Detailed acceptance records remain in `docs/milestones/`.\n\n"
          entry = '''## 2026-08-13 — M8.2 door hit-target usability correction automated GREEN

**Status:** product-code GREEN in Draft PR #87; final docs-head verification and one focused product-owner door-UX confirmation remain **PENDING**.

After the product owner reported room marquee **PASS**, window movement **PASS** and functional door movement/runtime **PASS**, one usability issue remained: the door was still difficult to acquire because pointer-down effectively required the thin leaf.

The permanent Playwright regression now starts drag from the centre of the door's wall-opening span. Clean RED `e41c695b193a9e20ec0173453cd23d093f1bfaab` kept CI #5074 GREEN while Browser #1524 produced 54 PASS / 1 FAIL, with only the new door opening-span path failing. Production patch `9f37c7c0db394e7f924c732e4d191d3bff724ecf` makes the wall opening, leaf and swing arc practical targets without making the entire swing sector clickable.

```text
clean product-code head:       8f9317db650bd076df957028035f6a643d0ec470
CI #5082 / run 31679924606:   PASS
Browser Acceptance #1532:     PASS — Chromium + WebKit
browser artifact:              9173229566
artifact digest:               sha256:14ff9ba47d708c881adfdccf89f11218efac4af9f54862f332ebd0f487b65ea3
```

No schema, geometry authority, `wallId`, host-wall validation, M2, recognition or semantic-history contract changed. The full swing sector deliberately remains non-listening so nearby room/furniture interaction is not captured accidentally.

Focused record: `docs/changelog/2026-08-13-m8-2-door-hit-target-correction.md`.

Next gate: fresh exact-head CI + Chromium/WebKit after this canonical truth-sync, then only the focused real-session door-acquisition confirmation. The already reported marquee/window PASS does not need to be repeated.

---

'''
          text = replace_once(text, marker, marker + entry, "CHANGELOG prepend")
          path.write_text(text)
          PY

          git diff --check
          git diff -- docs/PROJECT_STATE.md docs/ROADMAP.md docs/product/UX_ROADMAP.md docs/CHANGELOG.md

      - name: Commit documentation truth sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/product/UX_ROADMAP.md docs/CHANGELOG.md
          git commit -m "docs(m8.2): sync door hit-target correction state"
          git push origin HEAD:feat/m8-2-precision-structural-editing

name: Apply M8.2 Door Hit Target Truth Sync

on:
  push:
    branches:
      - feat/m8-2-precision-structural-editing
    paths:
      - .github/workflows/apply-m8-2-door-hit-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-2-precision-structural-editing
          fetch-depth: 0

      - name: Apply documentation truth sync
        run: |
          python tools/m7-browser-audit/temp-m8-2-door-doc-sync.py
          sed -i '4s/[[:space:]]*$//' docs/PROJECT_STATE.md

      - name: Verify documentation diff
        run: |
          git diff --check
          git diff -- docs/PROJECT_STATE.md docs/ROADMAP.md docs/product/UX_ROADMAP.md docs/CHANGELOG.md

      - name: Commit documentation truth sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/product/UX_ROADMAP.md docs/CHANGELOG.md
          git commit -m "docs(m8.2): sync door hit-target correction state"
          git push origin HEAD:feat/m8-2-precision-structural-editing

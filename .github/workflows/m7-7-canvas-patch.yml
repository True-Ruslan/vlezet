name: M7.7 Canvas Patch

on:
  push:
    branches:
      - feat/m7-7-furniture-fit-workflow
    paths:
      - .github/workflows/m7-7-canvas-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-7-furniture-fit-workflow
          fetch-depth: 0
      - name: Apply focused Canvas feedback patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          canvas_path = Path("apps/web/components/editor/editor-canvas.tsx")
          source = canvas_path.read_text()

          replacements = [
              (
                  'import { ExactGapOverlay } from "./exact-gap-overlay";\n',
                  'import { ExactGapOverlay } from "./exact-gap-overlay";\nimport { fitStatusPresentation } from "./fit-status-badge";\n',
              ),
              (
                  '  const placementPreviewFitStatus = visiblePlacementPreview\n    ? fitEvaluation.byObjectId.get(PLACEMENT_PREVIEW_ID)?.status ?? "blocked"\n    : null;\n',
                  '  const placementPreviewFitStatus = visiblePlacementPreview\n    ? fitEvaluation.byObjectId.get(PLACEMENT_PREVIEW_ID)?.status ?? "blocked"\n    : null;\n  const placementPreviewFitLabel = placementPreviewFitStatus\n    ? fitStatusPresentation(placementPreviewFitStatus).label\n    : null;\n',
              ),
              (
                  '      </Stage>\n      {errorDiagnostics.length > 0 ? <div className="topology-alert" role="status">Проверьте геометрию: {errorDiagnostics[0]?.message}</div> : null}\n',
                  '      </Stage>\n      {visiblePlacementPreview && placementPreviewFitLabel ? (\n        <div\n          className="placement-fit-label"\n          data-fit-status={placementPreviewFitStatus}\n          role="status"\n          aria-live="polite"\n        >\n          {placementPreviewFitLabel}\n        </div>\n      ) : null}\n      {selectedObject ? (\n        <div className="object-canvas-legend" aria-label="Обозначения выбранного предмета">\n          <span><i className="object-canvas-legend-swatch is-dimension" aria-hidden="true" />Размер предмета</span>\n          <span><i className="object-canvas-legend-swatch is-recommended" aria-hidden="true" />Рекомендуемая зона использования</span>\n          <span><i className="object-canvas-legend-swatch is-actual" aria-hidden="true" />Свободно сейчас</span>\n        </div>\n      ) : null}\n      {errorDiagnostics.length > 0 ? <div className="topology-alert" role="status">Проверьте геометрию: {errorDiagnostics[0]?.message}</div> : null}\n',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one Canvas replacement target, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          canvas_path.write_text(source)

          css_path = Path("apps/web/app/m7-furniture-fit.css")
          css = css_path.read_text()
          marker = "\n.placement-fit-label {\n"
          if marker in css:
              raise SystemExit("Canvas feedback CSS already exists")
          css += '''

.placement-fit-label {
  position: absolute;
  z-index: 6;
  top: 14px;
  left: 50%;
  max-width: calc(100% - 28px);
  padding: 7px 11px;
  border: 1px solid #c7d7f7;
  border-radius: 999px;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.94);
  color: #174ea6;
  font-size: 11px;
  font-weight: 750;
  line-height: 1.3;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
  backdrop-filter: blur(8px);
}

.placement-fit-label[data-fit-status="fits"] {
  border-color: #a7f3d0;
  background: rgba(236, 253, 245, 0.96);
  color: #067647;
}

.placement-fit-label[data-fit-status="tight"] {
  border-color: #fed7aa;
  background: rgba(255, 250, 235, 0.96);
  color: #b54708;
}

.placement-fit-label[data-fit-status="blocked"] {
  border-color: #fecaca;
  background: rgba(254, 243, 242, 0.96);
  color: #b42318;
}

.object-canvas-legend {
  position: absolute;
  z-index: 5;
  left: 14px;
  bottom: 52px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  max-width: min(620px, calc(100% - 28px));
  padding: 8px 10px;
  border: 1px solid rgba(220, 224, 230, 0.92);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.92);
  color: #475569;
  font-size: 10px;
  line-height: 1.35;
  pointer-events: none;
  box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
  backdrop-filter: blur(8px);
}

.object-canvas-legend > span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
}

.object-canvas-legend-swatch {
  display: inline-block;
  width: 18px;
  height: 0;
  flex: none;
  border-top: 2px solid #1769ff;
}

.object-canvas-legend-swatch.is-recommended {
  border-top-color: #d97706;
  border-top-style: dashed;
}

.object-canvas-legend-swatch.is-actual {
  border-top-color: #64748b;
  border-top-width: 1px;
}

@media (max-width: 520px) {
  .placement-fit-label {
    top: 10px;
    font-size: 10px;
  }

  .object-canvas-legend {
    right: 10px;
    bottom: 58px;
    left: 10px;
    display: grid;
    gap: 4px;
    max-width: none;
  }
}
'''
          css_path.write_text(css)

          Path(".github/workflows/m7-7-canvas-patch.yml").unlink()
          PY
      - name: Commit focused product patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: explain furniture fit on Canvas"
          git push origin HEAD:feat/m7-7-furniture-fit-workflow

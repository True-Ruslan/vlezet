name: Apply guarded browser Apply persistence wait

on:
  workflow_dispatch:
  push:
    branches:
      - feat/m7-8c-1-hybrid-ai-proposal-recovery
    paths:
      - .github/workflows/fix-browser-apply-persistence-wait.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-8c-1-hybrid-ai-proposal-recovery
          fetch-depth: 0
      - name: Patch Apply persistence synchronization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/m7-browser-audit/recognition-ai-proposals.spec.mjs")
          source = path.read_text()
          replacements = [
            (
              '''async function applySelected(page, projectId) {\n  await page.getByRole("button", { name: "Применить выбранное", exact: true }).click();\n  await expect(page.getByRole("button", { name: "Уже применено", exact: true })).toBeDisabled();\n  await expect.poll(async () => (await readRecord(page, "projects", projectId))?.document?.walls?.length ?? 0).toBeGreaterThan(0);\n  return readRecord(page, "projects", projectId);\n}''',
              '''async function applySelected(page, projectId, expectedOpeningCount) {\n  await page.getByRole("button", { name: "Применить выбранное", exact: true }).click();\n  await expect(page.getByRole("button", { name: "Уже применено", exact: true })).toBeDisabled();\n  await expect.poll(async () => (await readRecord(page, "projects", projectId))?.document?.openings?.length ?? 0).toBe(expectedOpeningCount);\n  return readRecord(page, "projects", projectId);\n}''',
            ),
            (
              '''  const firstProject = await applySelected(page, projectId);''',
              '''  const firstProject = await applySelected(page, projectId, 1);''',
            ),
            (
              '''  const secondProject = await applySelected(page, projectId);''',
              '''  const secondProject = await applySelected(page, projectId, 2);''',
            ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one Apply anchor, found {count}")
              source = source.replace(old, new)
          path.write_text(source)
          PY
          rm .github/workflows/fix-browser-apply-persistence-wait.yml
          git diff --check
      - name: Commit fix and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/m7-browser-audit/recognition-ai-proposals.spec.mjs \
            .github/workflows/fix-browser-apply-persistence-wait.yml
          git commit -m "test: wait for each browser Apply persistence boundary"
          git push origin HEAD:feat/m7-8c-1-hybrid-ai-proposal-recovery

name: Recognition Benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/components/recognition/**"
      - "apps/web/app/%5F%5Frecognition-benchmark/**"
      - "packages/recognition/**"
      - "tools/recognition-benchmark/**"
      - ".github/workflows/recognition-benchmark.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install product dependencies
        run: pnpm install --frozen-lockfile

      - name: Install benchmark harness
        working-directory: tools/recognition-benchmark
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        working-directory: tools/recognition-benchmark
        run: npx playwright install --with-deps chromium

      - name: Verify benchmark fixtures
        run: npm --prefix tools/recognition-benchmark run verify:fixtures

      - name: Generate public real-plan analogue fixtures
        run: pnpm benchmark:recognition:real:generate

      - name: Verify public real-plan analogue fixtures
        run: pnpm benchmark:recognition:real:verify

      - name: Assert no private source bytes are committed
        run: node tools/recognition-benchmark/private-source-check.mjs assert-repository .

      - name: Verify M7.8C gate contract
        run: node --test tools/recognition-benchmark/m7-8c-opening-gate.test.mjs

      - name: Run Core Recognition Benchmark
        id: core_benchmark
        continue-on-error: true
        env:
          RECOGNITION_BENCHMARK_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm benchmark:recognition:core

      - name: Start benchmark-only Vlezet harness
        shell: bash
        run: |
          set -euo pipefail
          RECOGNITION_BENCHMARK_HARNESS=1 NEXT_TELEMETRY_DISABLED=1 pnpm --dir apps/web exec next dev --hostname 127.0.0.1 > /tmp/vlezet-recognition-benchmark.log 2>&1 &
          echo $! > /tmp/vlezet-recognition-benchmark.pid
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/__recognition-benchmark > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vlezet-recognition-benchmark.log
          exit 1

      - name: Run Chromium Source Benchmark
        working-directory: tools/recognition-benchmark
        env:
          RECOGNITION_BENCHMARK_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test recognition-source.spec.mjs --config=playwright.config.mjs --workers=1

      - name: Score Source Recognition Benchmark
        env:
          RECOGNITION_BENCHMARK_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm --prefix tools/recognition-benchmark run score:source

      - name: Run real source OpenCV benchmark
        working-directory: tools/recognition-benchmark
        env:
          RECOGNITION_BENCHMARK_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test recognition-real-source.spec.mjs --config=playwright.config.mjs --workers=1

      - name: Score real source benchmark
        env:
          RECOGNITION_BENCHMARK_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm benchmark:recognition:real-source-score

      - name: Enforce M7.8C Core and Source opening gates
        run: pnpm benchmark:recognition:m7-8c-gate tools/recognition-benchmark/artifacts/core/recognition-core-result.json tools/recognition-benchmark/artifacts/source/recognition-source-result.json

      - name: Enforce real fixture scenario gate
        run: pnpm benchmark:recognition:real:gate tools/recognition-benchmark/artifacts/real-source/recognition-real-source-result.json

      - name: Assemble recognition benchmark evidence
        env:
          RECOGNITION_CORE_RESULT_PATH: tools/recognition-benchmark/artifacts/core/recognition-core-result.json
          RECOGNITION_SOURCE_RESULT_PATH: tools/recognition-benchmark/artifacts/source/recognition-source-result.json
          RECOGNITION_SOURCE_OVERLAYS_DIR: tools/recognition-benchmark/artifacts/source
          RECOGNITION_EVIDENCE_OUTPUT_DIR: tools/recognition-benchmark/artifacts/evidence
        run: pnpm benchmark:recognition:evidence

      - name: Upload generated real-plan analogue assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recognition-real-fixture-assets
          path: packages/recognition/benchmarks/real-analogues/fixtures
          if-no-files-found: error
          retention-days: 14

      - name: Upload Recognition Benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recognition-benchmark-evidence
          path: |
            tools/recognition-benchmark/artifacts/core
            tools/recognition-benchmark/artifacts/source
            tools/recognition-benchmark/artifacts/real-source
            tools/recognition-benchmark/artifacts/evidence
            tools/recognition-benchmark/test-results
            /tmp/vlezet-recognition-benchmark.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop benchmark harness
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/vlezet-recognition-benchmark.pid ]; then
            kill "$(cat /tmp/vlezet-recognition-benchmark.pid)" || true
          fi

      - name: Enforce Core Recognition Benchmark gate
        if: always() && steps.core_benchmark.outcome == 'failure'
        run: |
          echo "Core Recognition Benchmark failed. Evidence was preserved for explicit baseline review."
          exit 1

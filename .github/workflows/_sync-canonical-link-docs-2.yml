name: Apply canonical link continuity sync

on:
  push:
    branches: [docs/sync-canonical-portfolio-link]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sync-canonical-portfolio-link
          fetch-depth: 0
      - name: Patch documents
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = [
              (
                  Path('docs/PROJECT_STATE.md'),
                  '\n\n## 1. Product',
                  '''\n\n## Repository visibility update — 2026-08-01\n\nThe public README now exposes the canonical author and engineering-portfolio origin `https://trueruslan.ru/`.\n\n```text\nfeature PR:          #36\naccepted head:       5ac744cb2966e933375b217c0e250042355921ca\nCI:                  30714871143 / #2318 — PASS\nsquash merge:        accbf57a9ef810217f7066d0e9a862b7e5a406a1\nchanged file:        README.md only\n```\n\nThis is repository-discovery maintenance only. It changes no product capability, architecture, persistence, geometry, recognition, planning, 3D or browser-acceptance claim. **M7.7 Furniture and Fit Workflow remains the only selected next implementation slice.**\n''',
                  'feature PR:          #36',
              ),
              (
                  Path('docs/ROADMAP.md'),
                  '\n\n## Summary',
                  '''\n\n> **Repository maintenance note (2026-08-01):** README canonical portfolio link rollout completed through PR #36 (`5ac744c` → squash `accbf57`), exact-head CI #2318 / run `30714871143` PASS. This does not alter roadmap sequencing; M7.7 remains `NOW`.\n''',
                  'README canonical portfolio link rollout completed through PR #36',
              ),
              (
                  Path('docs/CHANGELOG.md'),
                  '\n\n## 2026-07-30 — M7.0 Product and UX Audit accepted',
                  '''\n\n## 2026-08-01 — Canonical engineering-portfolio link\n\n**Status:** merged to `main`; exact-head CI PASS.\n\n```text\nPR:                  #36\naccepted head:       5ac744cb2966e933375b217c0e250042355921ca\nCI:                  30714871143 / #2318 — PASS\nsquash merge:        accbf57a9ef810217f7066d0e9a862b7e5a406a1\n```\n\nAdded one explicit README link to `https://trueruslan.ru/`. No project-relative link, runtime behavior, schema, persistence, product milestone, recognition boundary, fit authority, planning authority or 3D behavior changed. M7.7 remains the selected next slice.\n\n---\n''',
                  '## 2026-08-01 — Canonical engineering-portfolio link',
              ),
          ]

          for path, marker, block, sentinel in changes:
              text = path.read_text(encoding='utf-8')
              if sentinel in text:
                  continue
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: expected exactly one marker, found {text.count(marker)}')
              path.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/_sync-canonical-link-docs.yml
          rm -f .github/workflows/_sync-canonical-link-docs-2.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md .github/workflows/_sync-canonical-link-docs.yml .github/workflows/_sync-canonical-link-docs-2.yml
          git commit -m 'docs: sync canonical portfolio link state'
          git push origin HEAD:docs/sync-canonical-portfolio-link

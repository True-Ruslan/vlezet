name: Recognition AI Benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated OpenRouter vision model IDs (maximum 3)"
        required: true
        default: "google/gemini-2.5-flash"
        type: string
      fixtures:
        description: "Comma-separated public verification fixture IDs (maximum 12)"
        required: true
        default: "real-plan-001-anonymized,real-plan-002-anonymized,real-plan-008-anonymized"
        type: string
      proposal_fixtures:
        description: "Comma-separated reviewed Stage 1 proposal fixture IDs (maximum 12)"
        required: true
        default: "real-plan-001-anonymized"
        type: string
      repetitions:
        description: "Repeated runs per model and fixture (1-5; Stage 1 requires at least 3)"
        required: true
        default: "3"
        type: string
      mode:
        description: "Verification or bounded Stage 1 proposal scope"
        required: true
        default: "disputed-zones"
        type: choice
        options:
          - disputed-zones
          - verification
          - proposal-discovery-stage1

permissions:
  contents: read

concurrency:
  group: recognition-ai-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: bounded-openrouter-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Validate OpenRouter secret before paid setup
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY is required; no paid benchmark request was sent." >&2
            exit 1
          fi

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install benchmark harness
        working-directory: tools/recognition-benchmark
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        working-directory: tools/recognition-benchmark
        run: npx playwright install --with-deps chromium

      - name: Verify live proposal runner contracts without paid requests
        run: pnpm test:recognition:ai-proposal-live

      - name: Generate public real-plan analogue fixtures
        run: pnpm benchmark:recognition:real:generate

      - name: Verify public real-plan analogue fixtures
        run: pnpm benchmark:recognition:real:verify

      - name: Assert no private source bytes are committed
        run: node tools/recognition-benchmark/private-source-check.mjs assert-repository .

      - name: Start benchmark-only Vlezet harness
        env:
          OPENROUTER_API_KEY: ${{ inputs.mode == 'proposal-discovery-stage1' && secrets.OPENROUTER_API_KEY || '' }}
        shell: bash
        run: |
          set -euo pipefail
          RECOGNITION_BENCHMARK_HARNESS=1 NEXT_TELEMETRY_DISABLED=1 pnpm --dir apps/web exec next dev --hostname 127.0.0.1 > /tmp/vlezet-recognition-ai-benchmark.log 2>&1 &
          echo $! > /tmp/vlezet-recognition-ai-benchmark.pid
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/__recognition-benchmark > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vlezet-recognition-ai-benchmark.log
          exit 1

      - name: Run real source OpenCV benchmark
        working-directory: tools/recognition-benchmark
        env:
          RECOGNITION_BENCHMARK_BASE_URL: http://127.0.0.1:3000
          RECOGNITION_BENCHMARK_COMMIT_SHA: ${{ github.sha }}
        run: npx playwright test recognition-real-source.spec.mjs --config=playwright.config.mjs --workers=1

      - name: Score real source benchmark
        env:
          RECOGNITION_BENCHMARK_COMMIT_SHA: ${{ github.sha }}
        run: pnpm benchmark:recognition:real-source-score

      - name: Run bounded OpenRouter verification benchmark
        if: ${{ inputs.mode != 'proposal-discovery-stage1' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_BENCHMARK_MODELS: ${{ inputs.models }}
          AI_BENCHMARK_FIXTURES: ${{ inputs.fixtures }}
          AI_BENCHMARK_REPETITIONS: ${{ inputs.repetitions }}
          AI_BENCHMARK_MODE: ${{ inputs.mode }}
          AI_BENCHMARK_MAX_TOKENS: "2048"
          AI_BENCHMARK_TIMEOUT_MS: "90000"
          AI_BENCHMARK_MAX_COST_USD: "5"
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm benchmark:recognition:ai

      - name: Evaluate verification benchmark qualification
        if: ${{ always() && inputs.mode != 'proposal-discovery-stage1' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm benchmark:recognition:ai-qualify
          review="tools/recognition-benchmark/artifacts/ai/recognition-ai-verification-qualification.md"
          test -s "$review"
          cat "$review" >> "$GITHUB_STEP_SUMMARY"

      - name: Run bounded Stage 1 live proposal benchmark
        if: ${{ inputs.mode == 'proposal-discovery-stage1' }}
        working-directory: tools/recognition-benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RECOGNITION_BENCHMARK_BASE_URL: http://127.0.0.1:3000
          AI_BENCHMARK_MODELS: ${{ inputs.models }}
          AI_BENCHMARK_FIXTURES: ${{ inputs.proposal_fixtures }}
          AI_BENCHMARK_REPETITIONS: ${{ inputs.repetitions }}
          AI_BENCHMARK_MODE: proposal-discovery-stage1
          AI_BENCHMARK_MAX_TOKENS: "2048"
          AI_BENCHMARK_TIMEOUT_MS: "90000"
          AI_BENCHMARK_MAX_COST_USD: "5"
          GITHUB_SHA: ${{ github.sha }}
        run: npx playwright test recognition-ai-proposal-live.spec.mjs --config=playwright.config.mjs --workers=1

      - name: Prepare Stage 1 proposal qualification artifact
        if: ${{ inputs.mode == 'proposal-discovery-stage1' }}
        run: pnpm benchmark:recognition:ai-proposal-qualify

      - name: Require at least one model eligible for explicit manual review
        if: ${{ inputs.mode == 'proposal-discovery-stage1' }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const path = 'tools/recognition-benchmark/artifacts/ai/recognition-ai-proposal-qualification.json';
          const report = JSON.parse(readFileSync(path, 'utf8'));
          const eligible = Array.isArray(report.models)
            ? report.models.filter((model) => model.eligibleForManualReview === true)
            : [];
          if (eligible.length === 0) {
            throw new Error('No model qualified for explicit manual review. Inspect the uploaded sanitized artifact.');
          }
          if (report.qualified !== false || report.selectedModelId !== null || report.automaticModelSelectionAllowed !== false) {
            throw new Error('Qualification artifact attempted to select or promote a model automatically.');
          }
          console.log(`${eligible.length} model(s) are eligible for explicit manual review; automatic selection remains disabled.`);
          NODE

      - name: Assert produced evidence contains no secrets or source bytes
        id: artifact_safety
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(
            tools/recognition-benchmark/artifacts/ai/*.json
            tools/recognition-benchmark/artifacts/ai/*.md
          )
          if [ "${#artifacts[@]}" -gt 0 ] && grep -Eiq 'sk-or-v1-|Authorization[[:space:]]*:[[:space:]]*Bearer|Bearer[[:space:]]+sk-|data:image|base64|provider_headers|sourceImageDataUrl|overlayImageDataUrl|rawProviderResponse' "${artifacts[@]}"; then
            echo "AI benchmark artifact contains secret-like, provider-header, raw response or source-image material" >&2
            exit 1
          fi
          if [ -f /tmp/vlezet-recognition-ai-benchmark.log ] && grep -Eiq 'sk-or-v1-|Authorization[[:space:]]*:[[:space:]]*Bearer|Bearer[[:space:]]+sk-' /tmp/vlezet-recognition-ai-benchmark.log; then
            echo "Benchmark log contains secret-like material" >&2
            exit 1
          fi

      - name: Upload AI benchmark evidence
        if: ${{ always() && steps.artifact_safety.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: recognition-ai-benchmark-evidence
          path: |
            tools/recognition-benchmark/artifacts/ai
            tools/recognition-benchmark/artifacts/real-source
            /tmp/vlezet-recognition-ai-benchmark.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop benchmark harness
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/vlezet-recognition-ai-benchmark.pid ]; then
            kill "$(cat /tmp/vlezet-recognition-ai-benchmark.pid)" || true
          fi

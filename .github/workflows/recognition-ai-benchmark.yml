name: Recognition AI Benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated OpenRouter vision model IDs (maximum 3)"
        required: true
        default: "google/gemini-2.5-flash"
        type: string
      fixtures:
        description: "Comma-separated public fixture IDs (maximum 12)"
        required: true
        default: "real-plan-001-anonymized,real-plan-002-anonymized,real-plan-008-anonymized"
        type: string
      repetitions:
        description: "Repeated verification runs per model and fixture (1-5)"
        required: true
        default: "3"
        type: string
      mode:
        description: "Verification scope"
        required: true
        default: "disputed-zones"
        type: choice
        options:
          - disputed-zones
          - verification

permissions:
  contents: read

concurrency:
  group: recognition-ai-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: bounded-openrouter-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install benchmark harness
        working-directory: tools/recognition-benchmark
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        working-directory: tools/recognition-benchmark
        run: npx playwright install --with-deps chromium

      - name: Generate public real-plan analogue fixtures
        run: pnpm benchmark:recognition:real:generate

      - name: Verify public real-plan analogue fixtures
        run: pnpm benchmark:recognition:real:verify

      - name: Assert no private source bytes are committed
        run: node tools/recognition-benchmark/private-source-check.mjs assert-repository .

      - name: Start benchmark-only Vlezet harness
        shell: bash
        run: |
          set -euo pipefail
          RECOGNITION_BENCHMARK_HARNESS=1 NEXT_TELEMETRY_DISABLED=1 pnpm --dir apps/web exec next dev --hostname 127.0.0.1 > /tmp/vlezet-recognition-ai-benchmark.log 2>&1 &
          echo $! > /tmp/vlezet-recognition-ai-benchmark.pid
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/__recognition-benchmark > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vlezet-recognition-ai-benchmark.log
          exit 1

      - name: Run real source OpenCV benchmark
        working-directory: tools/recognition-benchmark
        env:
          RECOGNITION_BENCHMARK_BASE_URL: http://127.0.0.1:3000
          RECOGNITION_BENCHMARK_COMMIT_SHA: ${{ github.sha }}
        run: npx playwright test recognition-real-source.spec.mjs --config=playwright.config.mjs --workers=1

      - name: Score real source benchmark
        env:
          RECOGNITION_BENCHMARK_COMMIT_SHA: ${{ github.sha }}
        run: pnpm benchmark:recognition:real-source-score

      - name: Run bounded OpenRouter benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_BENCHMARK_MODELS: ${{ inputs.models }}
          AI_BENCHMARK_FIXTURES: ${{ inputs.fixtures }}
          AI_BENCHMARK_REPETITIONS: ${{ inputs.repetitions }}
          AI_BENCHMARK_MODE: ${{ inputs.mode }}
          AI_BENCHMARK_MAX_TOKENS: "2048"
          AI_BENCHMARK_TIMEOUT_MS: "90000"
          AI_BENCHMARK_MAX_COST_USD: "5"
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm benchmark:recognition:ai

      - name: Evaluate verification benchmark qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          pnpm benchmark:recognition:ai-qualify
          review="tools/recognition-benchmark/artifacts/ai/recognition-ai-verification-qualification.md"
          test -s "$review"
          cat "$review" >> "$GITHUB_STEP_SUMMARY"

      - name: Assert AI artifact contains no secrets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact="tools/recognition-benchmark/artifacts/ai/recognition-ai-benchmark.json"
          test -s "$artifact"
          shopt -s nullglob
          artifacts=(
            tools/recognition-benchmark/artifacts/ai/*.json
            tools/recognition-benchmark/artifacts/ai/*.md
          )
          test "${#artifacts[@]}" -gt 0
          if grep -Eiq 'sk-or-v1-|Authorization[[:space:]]*:[[:space:]]*Bearer|Bearer[[:space:]]+sk-' "${artifacts[@]}"; then
            echo "AI benchmark artifacts contain secret-like material" >&2
            exit 1
          fi

      - name: Upload AI benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recognition-ai-benchmark-evidence
          path: |
            tools/recognition-benchmark/artifacts/ai
            tools/recognition-benchmark/artifacts/real-source
            /tmp/vlezet-recognition-ai-benchmark.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop benchmark harness
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/vlezet-recognition-ai-benchmark.pid ]; then
            kill "$(cat /tmp/vlezet-recognition-ai-benchmark.pid)" || true
          fi

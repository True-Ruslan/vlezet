name: Apply M8.2 Door Hit Target Patch

on:
  push:
    branches:
      - feat/m8-2-precision-structural-editing
    paths:
      - .github/workflows/apply-m8-2-door-hit-target.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/m8-2-precision-structural-editing
          fetch-depth: 0

      - name: Apply exact door hit-target patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/components/editor/editor-canvas.tsx")
          source = path.read_text()

          old_gap = '''    const elements = [<Line key={`${opening.id}-gap`} points={[start.x, start.y, end.x, end.y]} stroke="#ffffff" strokeWidth={gapWidth} listening={false} />];'''
          new_gap = '''    const doorGapInteractive = !preview && opening.kind === "door";
              const elements = [<Line key={`${opening.id}-gap`} name={doorGapInteractive ? canvasEntityName("opening", opening.id) : undefined} points={[start.x, start.y, end.x, end.y]} stroke="#ffffff" strokeWidth={gapWidth} hitStrokeWidth={doorGapInteractive ? Math.max(12, gapWidth) : undefined} listening={doorGapInteractive} onMouseDown={doorGapInteractive ? beginHostedOpeningPointerGesture : undefined} onTouchStart={doorGapInteractive ? beginHostedOpeningPointerGesture : undefined} onMouseEnter={doorGapInteractive ? enter : undefined} onMouseLeave={doorGapInteractive ? leave : undefined} />];'''
          old_arc = '''      elements.push(<Line key={`${opening.id}-arc`} points={arc} stroke={stroke} strokeWidth={1} dash={preview ? [7, 5] : [4, 3]} opacity={0.75} listening={false} />);'''
          new_arc = '''      elements.push(<Line key={`${opening.id}-arc`} name={!preview ? canvasEntityName("opening", opening.id) : undefined} points={arc} stroke={stroke} strokeWidth={1} dash={preview ? [7, 5] : [4, 3]} opacity={0.75} hitStrokeWidth={12} listening={!preview} onMouseDown={beginHostedOpeningPointerGesture} onTouchStart={beginHostedOpeningPointerGesture} onMouseEnter={enter} onMouseLeave={leave} />);'''

          if source.count(old_gap) != 1:
              raise SystemExit(f"expected exactly one door-gap source match, got {source.count(old_gap)}")
          if source.count(old_arc) != 1:
              raise SystemExit(f"expected exactly one door-arc source match, got {source.count(old_arc)}")

          source = source.replace(old_gap, new_gap, 1).replace(old_arc, new_arc, 1)
          path.write_text(source)
          PY

          git diff --check
          git diff -- apps/web/components/editor/editor-canvas.tsx

      - name: Commit production patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/editor/editor-canvas.tsx
          git commit -m "fix(canvas): widen door direct-manipulation hit target"
          git push origin HEAD:feat/m8-2-precision-structural-editing

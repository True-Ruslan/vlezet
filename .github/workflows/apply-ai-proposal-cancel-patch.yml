name: Apply guarded AI proposal cancellation patch

on:
  push:
    branches:
      - feat/m7-8c-1-hybrid-ai-proposal-recovery
    paths:
      - .github/workflows/apply-ai-proposal-cancel-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-8c-1-hybrid-ai-proposal-recovery
          fetch-depth: 0
      - name: Apply exact guarded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}")
              file.write_text(source.replace(old, new))

          controller = "apps/web/components/recognition/recognition-controller.ts"
          replace_exact(
              controller,
              '''      localDraftFingerprint: string;\n    }>''',
              '''      localDraftFingerprint: string;\n      cancel: () => void;\n    }>''',
          )
          replace_exact(
              controller,
              '''      localDraftFingerprint,\n    });''',
              '''      localDraftFingerprint,\n      cancel: () => this.cancelAiProposalDiscovery(),\n    });''',
          )
          replace_exact(
              controller,
              '''  cancelRunning(): void {\n    this.#requestGeneration += 1;''',
              '''  cancelAiProposalDiscovery(): void {\n    if (this.#state.kind !== "running-ai-proposals") return;\n    const session = this.#state.session;\n    this.cancelRunning();\n    this.#setReviewState(session);\n  }\n\n  cancelRunning(): void {\n    this.#requestGeneration += 1;''',
          )

          panel = "apps/web/components/recognition/recognition-panel.tsx"
          replace_exact(
              panel,
              '''  aiProposalDiscoveryAvailable?: boolean;\n  onProposalDecision?:''',
              '''  aiProposalDiscoveryAvailable?: boolean;\n  onCancelAiProposalDiscovery?: () => void;\n  onProposalDecision?:''',
          )
          replace_exact(
              panel,
              '''  const proposalDiscoveryEnabled = Boolean(\n    props.aiProposalDiscoveryAvailable''',
              '''  const cancelAiProposalDiscovery = props.onCancelAiProposalDiscovery\n    ?? (props.state.kind === "running-ai-proposals" ? props.state.cancel : undefined);\n  const proposalDiscoveryEnabled = Boolean(\n    props.aiProposalDiscoveryAvailable''',
          )
          replace_exact(
              panel,
              '''      {props.state.kind === "stale" ? (''',
              '''      {props.state.kind === "running-ai-proposals" ? (\n        <UiNotice tone="info" title="AI-поиск пропущенных элементов" live className="recognition-progress-card">\n          <span className="recognition-progress-copy"><span className="recognition-spinner" aria-hidden="true" />Локальный черновик сохранён. Результат появится только после детерминированной проверки.</span>\n          <div className="recognition-inline-actions">\n            <UiButton variant="secondary" disabled={!cancelAiProposalDiscovery} onClick={cancelAiProposalDiscovery}>Отменить AI-поиск</UiButton>\n          </div>\n        </UiNotice>\n      ) : null}\n\n      {props.state.kind === "stale" ? (''',
          )

          ui_test = "apps/web/components/recognition/recognition-ai-proposal-cancel-ui.test.tsx"
          replace_exact(
              ui_test,
              '''          localDraftFingerprint: "recognition-local-draft-v1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",\n        }}''',
              '''          localDraftFingerprint: "recognition-local-draft-v1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",\n          cancel: () => undefined,\n        }}''',
          )

          browser = "tools/m7-browser-audit/recognition-ai-proposals.spec.mjs"
          replace_exact(
              browser,
              '''  await dialog.getByRole("button", { name: "Отменить запрос", exact: true }).click();''',
              '''  await page.getByRole("button", { name: "Отменить AI-поиск", exact: true }).click();''',
          )
          PY
          rm .github/workflows/apply-ai-proposal-cancel-patch.yml
          git diff --check
      - name: Commit guarded patch and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/recognition/recognition-controller.ts \
            apps/web/components/recognition/recognition-panel.tsx \
            apps/web/components/recognition/recognition-ai-proposal-cancel-ui.test.tsx \
            tools/m7-browser-audit/recognition-ai-proposals.spec.mjs \
            .github/workflows/apply-ai-proposal-cancel-patch.yml
          git commit -m "fix: make AI proposal discovery cancellable"
          git push origin HEAD:feat/m7-8c-1-hybrid-ai-proposal-recovery

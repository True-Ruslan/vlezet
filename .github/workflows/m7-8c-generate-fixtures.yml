name: M7.8C Generate Fixtures

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/recognition-benchmark/opening-segment-snapshot.mjs"
      - "tools/recognition-benchmark/generate-fixture-assets.mjs"
      - ".github/workflows/m7-8c-generate-fixtures.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install product dependencies
        run: pnpm install --frozen-lockfile

      - name: Install benchmark harness
        working-directory: tools/recognition-benchmark
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        working-directory: tools/recognition-benchmark
        run: npx playwright install --with-deps chromium

      - name: Generate canonical fixtures
        run: npm --prefix tools/recognition-benchmark run generate:fixtures

      - name: Commit generated snapshots
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/recognition/benchmarks/fixtures
          if git diff --cached --quiet; then
            echo "Generated fixtures are already current."
            exit 0
          fi
          git commit -m "test: regenerate opening-aware benchmark fixtures [skip ci]"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload generated fixtures
        uses: actions/upload-artifact@v4
        with:
          name: m7-8c-generated-fixtures
          path: packages/recognition/benchmarks/fixtures
          if-no-files-found: error
          retention-days: 3

name: M7.8C Generate Fixtures

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/recognition-benchmark/opening-segment-snapshot.mjs"
      - "tools/recognition-benchmark/generate-fixture-assets.mjs"
      - ".github/workflows/m7-8c-generate-fixtures.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install product dependencies
        run: pnpm install --frozen-lockfile

      - name: Install benchmark harness
        working-directory: tools/recognition-benchmark
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        working-directory: tools/recognition-benchmark
        run: npx playwright install --with-deps chromium

      - name: Generate canonical fixtures
        run: npm --prefix tools/recognition-benchmark run generate:fixtures

      - name: Upload generated fixtures
        uses: actions/upload-artifact@v4
        with:
          name: m7-8c-generated-fixtures
          path: packages/recognition/benchmarks/fixtures
          if-no-files-found: error
          retention-days: 3

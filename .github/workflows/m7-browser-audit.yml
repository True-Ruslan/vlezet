name: Browser Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - "tools/m7-browser-audit/**"
      - ".github/workflows/m7-browser-audit.yml"
      - "docs/PROJECT_STATE.md"
      - "docs/ROADMAP.md"
      - "docs/CHANGELOG.md"
      - "docs/product/UX_BROWSER_EVIDENCE.md"
      - "docs/product/UX_ROADMAP.md"
      - "docs/milestones/**"
      - "scripts/validate-m7-docs.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install product dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser audit harness
        working-directory: tools/m7-browser-audit
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium and WebKit
        working-directory: tools/m7-browser-audit
        run: npx playwright install --with-deps chromium webkit

      - name: Start Vlezet
        shell: bash
        run: |
          set -euo pipefail
          NEXT_TELEMETRY_DISABLED=1 pnpm --dir apps/web exec next dev --hostname 127.0.0.1 > /tmp/vlezet-dev.log 2>&1 &
          echo $! > /tmp/vlezet-dev.pid
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vlezet-dev.log
          exit 1

      - name: Run Chromium browser acceptance
        working-directory: tools/m7-browser-audit
        env:
          M7_BASE_URL: http://127.0.0.1:3000
        run: npm run audit

      - name: Run WebKit representative smoke
        working-directory: tools/m7-browser-audit
        env:
          M7_BASE_URL: http://127.0.0.1:3000
        run: npm run audit:webkit

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-evidence
          path: |
            tools/m7-browser-audit/artifacts
            tools/m7-browser-audit/test-results
            tools/m7-browser-audit/webkit-test-results
            /tmp/vlezet-dev.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Vlezet
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/vlezet-dev.pid ]; then
            kill "$(cat /tmp/vlezet-dev.pid)" || true
          fi

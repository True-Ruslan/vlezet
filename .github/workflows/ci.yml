name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  patch-m7-8c-window-evidence:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 42 && github.head_ref == 'feat/m7-8c-opening-classification-host-wall-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/m7-8c-opening-classification-host-wall-validation
          fetch-depth: 0

      - name: Apply bounded evidence patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1))

          openings = Path("packages/recognition/src/openings.ts")
          replace_once(
              openings,
              "function mergeProjectedRails(rails: readonly ProjectedRail[]): ProjectedRail[] {",
              "function mergeProjectedRails(\n  rails: readonly ProjectedRail[],\n  acrossTolerancePx: number,\n  gapTolerancePx: number,\n): ProjectedRail[] {",
          )
          replace_once(
              openings,
              "return Math.abs(candidateAcross - rail.across) <= 3\n        && rail.startAlong <= candidate.endAlong + 12\n        && rail.endAlong >= candidate.startAlong - 12;",
              "return Math.abs(candidateAcross - rail.across) <= acrossTolerancePx\n        && rail.startAlong <= candidate.endAlong + gapTolerancePx\n        && rail.endAlong >= candidate.startAlong - gapTolerancePx;",
          )
          text = openings.read_text()
          block_start = text.index("    const rawRails = symbolSegments.flatMap((segment): ProjectedRail[] => {")
          block_end = text.index("\n\n    const railWindows:", block_start)
          replacement = '''    const structuralRails = wallSegments.flatMap((segment): ProjectedRail[] => {
      if (angleDelta(segmentAngle(segment), wallAngle) > 8) return [];
      const a = { x: segment.x1, y: segment.y1 };
      const b = { x: segment.x2, y: segment.y2 };
      const pa = dot({ x: a.x - start.x, y: a.y - start.y }, tangent);
      const pb = dot({ x: b.x - start.x, y: b.y - start.y }, tangent);
      const startAlong = Math.max(0, Math.min(pa, pb));
      const endAlong = Math.min(wallLength, Math.max(pa, pb));
      if (endAlong - startAlong < 10) return [];
      const center = midpoint(a, b);
      const relative = { x: center.x - start.x, y: center.y - start.y };
      return [{
        startAlong,
        endAlong,
        centerAlong: (startAlong + endAlong) / 2,
        across: dot(relative, normal),
        lengthPx: endAlong - startAlong,
      }];
    });

    const rawRails = symbolSegments.flatMap((segment): ProjectedRail[] => {
      if (angleDelta(segmentAngle(segment), wallAngle) > 8) return [];
      const a = { x: segment.x1, y: segment.y1 };
      const b = { x: segment.x2, y: segment.y2 };
      const segmentLength = length(a, b);
      if (segmentLength < 18 || segmentLength > 240) return [];
      const pa = dot({ x: a.x - start.x, y: a.y - start.y }, tangent);
      const pb = dot({ x: b.x - start.x, y: b.y - start.y }, tangent);
      const startAlong = Math.min(pa, pb);
      const endAlong = Math.max(pa, pb);
      if (startAlong < 12 || wallLength - endAlong < 12) return [];
      const center = midpoint(a, b);
      const relative = { x: center.x - start.x, y: center.y - start.y };
      const across = dot(relative, normal);
      if (Math.abs(across) > expectedHalfThickness + 6) return [];
      const projected = {
        startAlong,
        endAlong,
        centerAlong: (startAlong + endAlong) / 2,
        across,
        lengthPx: endAlong - startAlong,
      };
      const structuralEcho = Math.abs(Math.abs(across) - expectedHalfThickness) <= edgeTolerance
        && structuralRails.some((edge) => {
          if (Math.abs(edge.across - across) > Math.max(2, expectedHalfThickness * 0.18)) return false;
          const overlap = Math.max(0, Math.min(edge.endAlong, endAlong) - Math.max(edge.startAlong, startAlong));
          return overlap / Math.max(1, Math.min(edge.lengthPx, projected.lengthPx)) >= 0.55;
        });
      return structuralEcho ? [] : [projected];
    });
    const rails = mergeProjectedRails(
      rawRails,
      Math.max(1.5, expectedHalfThickness * 0.12),
      Math.max(20, Math.min(32, expectedHalfThickness * 2.5)),
    );'''
          openings.write_text(text[:block_start] + replacement + text[block_end:])

          engine = Path("apps/web/components/recognition/local-recognition-engine.ts")
          text = engine.read_text()
          evidence_start = text.index("    const openingEvidenceSegments = deduplicateDetectedSegments([")
          evidence_end = text.index("\n\n    options.onProgress?.({ phase: \"walls\"", evidence_start)
          text = text[:evidence_start] + text[evidence_end + 2:]
          argument = "segments: openingEvidenceSegments,"
          if text.count(argument) != 1:
              raise SystemExit(f"engine opening argument matches: {text.count(argument)}")
          text = text.replace(argument, "wallSegments: segments,\n      symbolSegments,", 1)
          engine.write_text(text)
          PY

      - name: Commit bounded evidence patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/recognition/src/openings.ts apps/web/components/recognition/local-recognition-engine.ts
          git diff --cached --check
          git commit -m "fix: separate and stabilize raster window evidence"
          git push origin HEAD:feat/m7-8c-opening-classification-host-wall-validation

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: M7 documentation contract
        id: m7_docs
        shell: bash
        run: |
          set +e
          pnpm validate:m7-docs 2>&1 | tee m7-docs.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload M7 documentation diagnostics
        if: failure() && steps.m7_docs.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: m7-docs-diagnostics
          path: m7-docs.log
          if-no-files-found: error
          retention-days: 3

      - name: Unit tests
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: M7.8C gate unit tests
        run: node --test tools/recognition-benchmark/m7-8c-opening-gate.test.mjs

      - name: Upload test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
          if-no-files-found: error
          retention-days: 3

      - name: Core Recognition Benchmark
        id: recognition_core
        shell: bash
        env:
          RECOGNITION_BENCHMARK_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          pnpm benchmark:recognition:core 2>&1 | tee recognition-core.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Enforce M7.8C Core opening gate
        run: pnpm benchmark:recognition:m7-8c-gate tools/recognition-benchmark/artifacts/core/recognition-core-result.json

      - name: Upload Core Recognition Benchmark evidence
        if: always() && steps.recognition_core.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: recognition-core-benchmark
          path: |
            tools/recognition-benchmark/artifacts/core
            recognition-core.log
          if-no-files-found: error
          retention-days: 14

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload typecheck diagnostics
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 3

      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          pnpm lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload lint diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: error
          retention-days: 3

      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          pnpm build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          if-no-files-found: error
          retention-days: 3

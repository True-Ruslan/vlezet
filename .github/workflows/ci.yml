name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: M7 documentation contract
        id: m7_docs
        shell: bash
        run: |
          set +e
          pnpm validate:m7-docs 2>&1 | tee m7-docs.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload M7 documentation diagnostics
        if: failure() && steps.m7_docs.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: m7-docs-diagnostics
          path: m7-docs.log
          if-no-files-found: error
          retention-days: 3

      - name: Unit tests
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
          if-no-files-found: error
          retention-days: 3

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload typecheck diagnostics
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 3

      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          pnpm lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload lint diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: error
          retention-days: 3

      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          pnpm build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          if-no-files-found: error
          retention-days: 3

  m7_7_canvas_patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/m7-7-furniture-fit-workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/m7-7-furniture-fit-workflow
          fetch-depth: 0

      - name: Apply focused patch
        run: python scripts/m7-7-apply-canvas-patch.py

      - name: Commit focused product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: explain furniture fit on Canvas"
          git push origin HEAD:feat/m7-7-furniture-fit-workflow

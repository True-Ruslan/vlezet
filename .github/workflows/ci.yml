name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/m7-8c-1-hybrid-ai-proposal-recovery
          fetch-depth: 0

      - name: Apply exact Tasks 14-15 patch and self-clean
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/m7-8c-1-hybrid-ai-proposal-recovery'
        run: |
          set -euo pipefail
          cat .github/task15-patch.b64.* | tr -d '\n' | base64 --decode > /tmp/task15.patch
          test "$(wc -c < /tmp/task15.patch | tr -d ' ')" = "14234"
          test "$(sha256sum /tmp/task15.patch | awk '{print $1}')" = "dc05cf2cce7cef8ff415276d276fec62c0e837235057c40a4433cf090ae61430"
          git apply --check /tmp/task15.patch
          git apply /tmp/task15.patch
          git show b490e68e236c0811c12d11e0e84408bb6e71e2da:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/task15-atomic.patch
          rm .github/task15-patch.b64.*
          rm .github/workflows/task15-apply-patch.yml
          rm packages/recognition/src/task15-source-dump.test.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate atomic AI proposal workflow"
          git push origin "HEAD:feat/m7-8c-1-hybrid-ai-proposal-recovery"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: M7 documentation contract
        id: m7_docs
        shell: bash
        run: |
          set +e
          pnpm validate:m7-docs 2>&1 | tee m7-docs.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload M7 documentation diagnostics
        if: failure() && steps.m7_docs.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: m7-docs-diagnostics
          path: m7-docs.log
          if-no-files-found: error
          retention-days: 3

      - name: Unit tests
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: M7.8C gate unit tests
        run: node --test tools/recognition-benchmark/m7-8c-opening-gate.test.mjs

      - name: Upload test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
          if-no-files-found: error
          retention-days: 3

      - name: Core Recognition Benchmark
        id: recognition_core
        shell: bash
        env:
          RECOGNITION_BENCHMARK_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          pnpm benchmark:recognition:core 2>&1 | tee recognition-core.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Enforce M7.8C Core opening gate
        run: pnpm benchmark:recognition:m7-8c-gate tools/recognition-benchmark/artifacts/core/recognition-core-result.json

      - name: Upload Core Recognition Benchmark evidence
        if: always() && steps.recognition_core.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: recognition-core-benchmark
          path: |
            tools/recognition-benchmark/artifacts/core
            recognition-core.log
          if-no-files-found: error
          retention-days: 14

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload typecheck diagnostics
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 3

      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          pnpm lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload lint diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: error
          retention-days: 3

      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          pnpm build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          if-no-files-found: error
          retention-days: 3
